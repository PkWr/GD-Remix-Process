<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot — text forms sketch</title>
<!--
  Sketch only — not part of the app. Typed text as 3D forms over the demo
  images: flat → extruded → inflated → melted (the text version of Spot's
  square → globule), with twist / bend / wave, per-letter spin, and the
  picture wrapped on the letters or seen through them as glass.
  Fonts: typeface JSON converted from OFL fonts (vendor/fonts/typeface/).
-->
<style>
  @font-face { font-family: "IBM Plex Mono"; font-style: italic; font-weight: 400; src: url("vendor/fonts/ibm-plex-mono-latin-400-italic.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-style: italic; font-weight: 300; src: url("vendor/fonts/ibm-plex-mono-latin-300-italic.woff2") format("woff2"); }
  :root { --bg: #121315; --line: #2a2d31; --text: #ececec; --muted: #a3a3a3; --yellow: #ffe100; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body, button, input, select { font: italic 400 13px/1.4 "IBM Plex Mono", ui-monospace, monospace; color: var(--text); }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #panel {
    position: fixed; top: 16px; right: 16px; bottom: 16px; width: 330px; max-width: calc(100vw - 32px);
    display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.5); overflow: hidden; z-index: 2;
  }
  #panel.hidden { display: none; }
  .head { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
  .head h1 { margin: 0; font-size: 16px; font-weight: 400; }
  .head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .body { overflow-y: auto; padding: 8px 18px 18px; }
  .sec { margin: 14px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  label.row { display: grid; grid-template-columns: 92px 1fr 44px; gap: 8px; align-items: center; margin: 7px 0; }
  label.row span.v { text-align: right; color: var(--muted); font-size: 12px; }
  input[type=range] { width: 100%; accent-color: var(--yellow); }
  input[type=text], select {
    width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 10px; border: 1px solid #3a3d42;
    background: #0e0f11; color: var(--text); font-size: 14px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chip {
    padding: 7px 11px; border-radius: 999px; border: 1px solid #3a3d42; background: none; cursor: pointer; color: var(--text);
  }
  .chip[aria-pressed=true] { background: #3a3410; border-color: #8f7d1a; color: var(--yellow); }
  .form-read { color: var(--yellow); font-size: 12px; margin: -2px 0 4px 100px; }
  .note { color: var(--muted); font-size: 11px; margin: 10px 0 0; }
  #toggle {
    position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 3; padding: 8px 16px;
    border-radius: 999px; border: 0; background: rgba(0,0,0,.72); color: #fff; cursor: pointer; font-weight: 300;
  }
  #toggle:hover { color: var(--yellow); }
  @media (max-width: 600px) { #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-width: none; height: 55vh; border-radius: 16px 16px 0 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<aside id="panel" aria-label="Text form controls">
  <div class="head"><h1>Text forms — sketch</h1><p>Typed text as Spot's 3D forms. Sketch only; nothing saved.</p></div>
  <div class="body">
    <div class="sec">Text</div>
    <input type="text" id="text" value="Spot" maxlength="24" aria-label="Text">
    <div class="sec">Typeface</div>
    <select id="face" aria-label="Typeface">
      <option value="archivo-black">Archivo Black</option>
      <option value="dm-serif-display">DM Serif Display</option>
      <option value="ibm-plex-mono-italic">IBM Plex Mono Italic</option>
    </select>

    <div class="sec">Quick looks</div>
    <div class="chips" id="presets">
      <button class="chip" data-p="flat">Flat</button>
      <button class="chip" data-p="extruded">Extruded</button>
      <button class="chip" data-p="balloon">Balloon</button>
      <button class="chip" data-p="melt">Melt</button>
      <button class="chip" data-p="ribbon">Ribbon</button>
      <button class="chip" data-p="glass">Glass</button>
    </div>

    <div class="sec">Form</div>
    <label class="row">Form <input type="range" id="form" min="0" max="100" value="45"><span class="v" id="formV"></span></label>
    <div class="form-read" id="formRead"></div>
    <label class="row">Size <input type="range" id="size" min="10" max="100" value="55"><span class="v"></span></label>
    <label class="row">Spacing <input type="range" id="track" min="-20" max="80" value="6"><span class="v"></span></label>
    <label class="row">Depth <input type="range" id="depth" min="5" max="100" value="40"><span class="v"></span></label>
    <label class="row">Roundness <input type="range" id="bevel" min="0" max="100" value="45"><span class="v"></span></label>
    <label class="row">Variety <input type="range" id="variety" min="0" max="100" value="25"><span class="v"></span></label>

    <div class="sec">Deform</div>
    <label class="row">Twist <input type="range" id="twist" min="-100" max="100" value="0"><span class="v"></span></label>
    <label class="row">Bend <input type="range" id="bend" min="-100" max="100" value="0"><span class="v"></span></label>
    <label class="row">Wave <input type="range" id="wave" min="0" max="100" value="0"><span class="v"></span></label>

    <div class="sec">Motion</div>
    <div class="chips" id="layout">
      <button class="chip" data-v="word" aria-pressed="true">Word moves as one</button>
      <button class="chip" data-v="letters" aria-pressed="false">Letters move apart</button>
    </div>
    <label class="row">Spin <input type="range" id="spin" min="0" max="100" value="20"><span class="v"></span></label>
    <label class="row">Travel <input type="range" id="travel" min="-100" max="100" value="0"><span class="v"></span></label>

    <div class="sec">Surface</div>
    <div class="chips" id="surface">
      <button class="chip" data-v="image" aria-pressed="true">Picture on it</button>
      <button class="chip" data-v="glass" aria-pressed="false">Glass</button>
      <button class="chip" data-v="ink" aria-pressed="false">Ink</button>
    </div>
    <label class="row">Magnify <input type="range" id="magnify" min="0" max="100" value="45"><span class="v"></span></label>
    <div class="chips"><button class="chip" id="nextImg">Next picture</button></div>
    <p class="note">C hides this panel. Letters are cut into small pieces so they can bend smoothly; kerning isn't applied in this sketch.</p>
  </div>
</aside>
<button id="toggle" type="button">Controls (C)</button>

<script src="vendor/three.min.js"></script>
<script>
(function () {
  const T = THREE;
  const $ = (id) => document.getElementById(id);
  const val = (id) => +$(id).value;
  const state = { layout: "word", surface: "image" };

  // ---------- renderer, scenes ----------
  const renderer = new T.WebGLRenderer({ canvas: $("c"), antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.autoClear = false;
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(35, 1, 0.1, 200);
  camera.position.set(0, 0, 20);
  const VIEW_W = () => 2 * camera.position.z * Math.tan((camera.fov * Math.PI) / 360) * camera.aspect;

  // Background: the current demo picture, cover-cropped to the screen.
  const bgScene = new T.Scene();
  const bgCam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const shared = {
    uImg: { value: null }, uImgAspect: { value: 1 }, uRes: { value: new T.Vector2(1, 1) }, uTime: { value: 0 },
    uSkin: { value: null }, uSkinAspect: { value: 1 },
  };
  const COVER = `
    uniform sampler2D uImg; uniform float uImgAspect; uniform vec2 uRes;
    vec2 coverUV(vec2 s) {
      float sa = uRes.x / uRes.y;
      vec2 uv = s;
      if (sa > uImgAspect) uv.y = (s.y - 0.5) * (uImgAspect / sa) + 0.5;
      else uv.x = (s.x - 0.5) * (sa / uImgAspect) + 0.5;
      return uv;
    }`;
  bgScene.add(new T.Mesh(new T.PlaneGeometry(2, 2), new T.ShaderMaterial({
    uniforms: shared, depthWrite: false,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: COVER + `varying vec2 vUv; void main(){ gl_FragColor = texture2D(uImg, coverUV(vUv)); }`,
  })));

  // ---------- pictures ----------
  const pics = [];
  const PIC_COUNT = 42;
  let picIndex = 0;
  const loader = new T.TextureLoader();
  function loadPic(i) {
    return new Promise((res) => {
      const n = String(i).padStart(2, "0");
      loader.load(`assets/demo/demo-${n}.jpg`, (t) => { t.minFilter = T.LinearFilter; res(t); }, undefined, () => res(null));
    });
  }
  // The background is one picture; the letters wear a different one (as
  // Spot's forms wear a different frame), so they never camouflage.
  async function showPic(i) {
    const j = (i + 17) % PIC_COUNT;
    if (!pics[i]) pics[i] = await loadPic(i + 1);
    if (!pics[j]) pics[j] = await loadPic(j + 1);
    const t = pics[i], k = pics[j];
    if (t) { shared.uImg.value = t; shared.uImgAspect.value = t.image.width / t.image.height; }
    if (k) { shared.uSkin.value = k; shared.uSkinAspect.value = k.image.width / k.image.height; }
  }
  picIndex = Math.floor(Math.random() * PIC_COUNT);
  showPic(picIndex);
  $("nextImg").onclick = () => { picIndex = (picIndex + 1) % PIC_COUNT; showPic(picIndex); };
  setInterval(() => { picIndex = (picIndex + 1) % PIC_COUNT; showPic(picIndex); }, 7000);

  // ---------- fonts ----------
  const fonts = {};
  const fontLoader = new T.FontLoader();
  function getFont(key) {
    if (fonts[key]) return Promise.resolve(fonts[key]);
    return new Promise((res, rej) => fontLoader.load(`vendor/fonts/typeface/${key}.typeface.json`, (f) => { fonts[key] = f; res(f); }, undefined, rej));
  }

  // ---------- geometry: letters, cut fine so they can bend ----------
  function subdivide(geo, maxEdge, cap) {
    const src = geo.attributes.position.array;
    let tris = [];
    for (let i = 0; i < src.length; i += 9) tris.push([src[i], src[i + 1], src[i + 2], src[i + 3], src[i + 4], src[i + 5], src[i + 6], src[i + 7], src[i + 8]]);
    const m2 = maxEdge * maxEdge;
    const d2 = (t, a, b) => (t[a] - t[b]) ** 2 + (t[a + 1] - t[b + 1]) ** 2 + (t[a + 2] - t[b + 2]) ** 2;
    let changed = true;
    while (changed && tris.length < cap) {
      changed = false;
      const out = [];
      for (const t of tris) {
        const e0 = d2(t, 0, 3), e1 = d2(t, 3, 6), e2 = d2(t, 6, 0);
        const L = Math.max(e0, e1, e2);
        if (L <= m2 || out.length + tris.length > cap) { out.push(t); continue; }
        changed = true;
        // split the longest edge at its midpoint
        let a, b, c; // edge a-b is longest, c opposite
        if (L === e0) { a = 0; b = 3; c = 6; } else if (L === e1) { a = 3; b = 6; c = 0; } else { a = 6; b = 0; c = 3; }
        const mid = [(t[a] + t[b]) / 2, (t[a + 1] + t[b + 1]) / 2, (t[a + 2] + t[b + 2]) / 2];
        const P = (k) => [t[k], t[k + 1], t[k + 2]];
        out.push([...P(a), ...mid, ...P(c)]);
        out.push([...mid, ...P(b), ...P(c)]);
      }
      tris = out;
    }
    const g = new T.BufferGeometry();
    g.setAttribute("position", new T.Float32BufferAttribute(tris.flat(), 3));
    return g;
  }

  // Shared ("smooth") normals: every copy of a point gets the average of the
  // faces around it, so pushing along it inflates without cracking.
  function addSmoothNormals(g) {
    const p = g.attributes.position.array, n = g.attributes.normal.array;
    const acc = new Map();
    const key = (i) => `${Math.round(p[i] * 1e4)},${Math.round(p[i + 1] * 1e4)},${Math.round(p[i + 2] * 1e4)}`;
    for (let i = 0; i < p.length; i += 3) {
      const k = key(i); const a = acc.get(k) || [0, 0, 0];
      a[0] += n[i]; a[1] += n[i + 1]; a[2] += n[i + 2]; acc.set(k, a);
    }
    const s = new Float32Array(p.length);
    for (let i = 0; i < p.length; i += 3) {
      const a = acc.get(key(i)); const l = Math.hypot(a[0], a[1], a[2]) || 1;
      s[i] = a[0] / l; s[i + 1] = a[1] / l; s[i + 2] = a[2] / l;
    }
    g.setAttribute("aSmooth", new T.BufferAttribute(s, 3));
  }

  // ---------- material ----------
  const NOISE = `
    vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;} vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);} vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
    float snoise(vec3 v){const vec2 C=vec2(1.0/6.0,1.0/3.0);const vec4 D=vec4(0.0,0.5,1.0,2.0);
      vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.0-g;
      vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
      i=mod289(i);vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
      float n_=0.142857142857;vec3 ns=n_*D.wyz-D.xzx;vec4 j=p-49.0*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.0*x_);
      vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.0-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
      vec4 s0=floor(b0)*2.0+1.0;vec4 s1=floor(b1)*2.0+1.0;vec4 sh=-step(h,vec4(0.0));vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
      vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
      vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
      vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);m=m*m;
      return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}`;

  const VERT = NOISE + `
    attribute vec3 aSmooth;
    uniform float uTime, uSize, uFlat, uInflate, uMelt, uSpinA, uOffX, uOffY, uSeed;
    uniform float uWordW, uTwist, uBend, uWave, uTravelX;
    varying vec3 vN; varying vec3 vWorld; varying vec3 vWord; varying float vSoft;
    vec2 rot(vec2 p, float a){ float c=cos(a), s=sin(a); return vec2(c*p.x - s*p.y, s*p.x + c*p.y); }
    void main(){
      vec3 p = position; vec3 n = normal; vec3 sn = aSmooth;
      // flat -> extruded
      p.z *= mix(0.03, 1.0, uFlat);
      // inflate (balloon) and melt (lumpy, drooping) along shared normals
      p += sn * uInflate * uSize * 0.16;
      float nz = snoise(p / uSize * 1.6 + vec3(uSeed, 0.0, uTime * 0.25));
      p += sn * nz * uMelt * uSize * 0.22;
      p.y -= uMelt * uSize * 0.12 * (0.6 + 0.4 * nz);
      float soft = clamp(uInflate + uMelt, 0.0, 1.0);
      n = normalize(mix(n, sn, soft));
      // each letter's own spin, about its own centre
      p.xz = rot(p.xz, uSpinA); n.xz = rot(n.xz, uSpinA);
      // into the word
      p.x += uOffX + uTravelX; p.y += uOffY;
      // wave along the word
      p.y += uWave * uSize * 0.35 * sin(p.x / uSize * 1.4 + uTime * 1.6);
      // twist round the line of text
      float ta = uTwist * 3.14159 * p.x / max(uWordW, 0.001);
      p.yz = rot(p.yz, ta); n.yz = rot(n.yz, ta);
      // bend round a cylinder (positive bends away from you)
      if (abs(uBend) > 0.001) {
        float R = uWordW / (abs(uBend) * 3.14159);
        float sgn = sign(uBend);
        float th = p.x / R;
        float rr = R + p.z * sgn;
        p.x = rr * sin(th);
        p.z = sgn * (rr * cos(th) - R);
        n.xz = rot(n.xz, -th * sgn);
      }
      vWord = p;
      vec4 wp = modelMatrix * vec4(p, 1.0);
      vWorld = wp.xyz;
      vN = normalize(mat3(modelMatrix) * n);
      vSoft = soft;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`;

  const FRAG = COVER + `
    uniform float uSurface, uMagnify, uWordW, uSize; uniform sampler2D uSkin; uniform float uSkinAspect;
    varying vec3 vN; varying vec3 vWorld; varying vec3 vWord; varying float vSoft;
    void main(){
      vec3 fn = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
      vec3 N = normalize(mix(fn, normalize(vN), 0.35 + 0.65 * vSoft));
      if (!gl_FrontFacing) N = -N;
      vec3 V = normalize(cameraPosition - vWorld);
      vec3 L = normalize(vec3(0.4, 0.7, 0.6));
      float diff = max(dot(N, L), 0.0);
      float rim = pow(1.0 - max(dot(N, V), 0.0), 2.5);
      vec3 col;
      if (uSurface < 0.5) {
        // the picture laid across the whole word, front to back
        vec2 uv = vec2(vWord.x / uWordW + 0.5, vWord.y / (uWordW / uSkinAspect) + 0.5);
        col = texture2D(uSkin, uv).rgb * (0.38 + 0.72 * diff) + rim * 0.18;
      } else if (uSurface < 1.5) {
        // glass: the moving picture behind, bent through the letter
        vec2 s = gl_FragCoord.xy / uRes;
        vec2 off = N.xy * uMagnify * 0.09 - (s - 0.5) * uMagnify * 0.12;
        vec3 r = texture2D(uImg, coverUV(s - off)).rgb;
        vec3 g2 = texture2D(uImg, coverUV(s - off * 1.04)).rgb;
        col = vec3(r.r, mix(r.g, g2.g, 0.5), g2.b) * 1.05 + rim * 0.55 + pow(max(dot(reflect(-L, N), V), 0.0), 40.0) * 0.6;
      } else {
        col = vec3(0.07) + vec3(0.9) * pow(diff, 1.5) * 0.25 + rim * vec3(1.0, 0.88, 0.0) * 0.9;
      }
      gl_FragColor = vec4(col, 1.0);
    }`;

  function makeMaterial() {
    const m = new T.ShaderMaterial({
      uniforms: {
        ...shared,
        uSize: { value: 1 }, uFlat: { value: 1 }, uInflate: { value: 0 }, uMelt: { value: 0 },
        uSpinA: { value: 0 }, uOffX: { value: 0 }, uOffY: { value: 0 }, uSeed: { value: 0 },
        uWordW: { value: 1 }, uTwist: { value: 0 }, uBend: { value: 0 }, uWave: { value: 0 }, uTravelX: { value: 0 },
        uSurface: { value: 0 }, uMagnify: { value: 0.45 },
      },
      vertexShader: VERT, fragmentShader: FRAG, side: T.DoubleSide,
    });
    m.extensions.derivatives = true;
    return m;
  }

  // ---------- build the word ----------
  const word = new T.Group();
  scene.add(word);
  let letters = []; // { mesh, k, offX, spin }
  let wordW = 1, letterSize = 1, buildToken = 0;
  const rand = (k, s) => { const x = Math.sin(k * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };

  async function build() {
    const token = ++buildToken;
    const font = await getFont($("face").value);
    if (token !== buildToken) return;
    const text = $("text").value || " ";
    const size = (val("size") / 100) * VIEW_W() * 0.38;
    const depth = size * (val("depth") / 100) * 0.9;
    const bevel = val("bevel") / 100;
    const track = (val("track") / 100) * size * 0.5;
    const scale = size / font.data.resolution;
    letterSize = size;

    letters.forEach((l) => { word.remove(l.mesh); l.mesh.geometry.dispose(); l.mesh.material.dispose(); });
    letters = [];
    let x = 0;
    const placed = [];
    [...text].forEach((ch, i) => {
      const glyph = font.data.glyphs[ch] || font.data.glyphs["?"];
      const adv = (glyph ? glyph.ha : font.data.resolution * 0.5) * scale;
      if (ch.trim() && glyph) {
        const shapes = font.generateShapes(ch, size);
        let g = new T.ExtrudeGeometry(shapes, {
          depth, curveSegments: 10, bevelEnabled: bevel > 0.01,
          bevelThickness: depth * 0.5 * bevel + 0.0001, bevelSize: size * 0.045 * bevel, bevelSegments: 4,
        });
        if (g.index) g = g.toNonIndexed();
        g.computeBoundingBox();
        const bb = g.boundingBox;
        const cx = (bb.min.x + bb.max.x) / 2, cy = (bb.min.y + bb.max.y) / 2, cz = (bb.min.z + bb.max.z) / 2;
        g.translate(-cx, -cy, -cz);
        g = subdivide(g, size * 0.07, 60000);
        g.computeVertexNormals();
        addSmoothNormals(g);
        const mesh = new T.Mesh(g, makeMaterial());
        placed.push({ mesh, k: i + 1, centre: x + cx, cy });
      }
      x += adv + track;
    });
    wordW = Math.max(size, x - track);
    placed.forEach((l) => { l.offX = l.centre - wordW / 2; word.add(l.mesh); letters.push(l); });
  }

  // ---------- form readout + presets ----------
  function formStages(f) {
    const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
    return { flat: ss(0, 0.33, f), inflate: ss(0.33, 0.66, f), melt: ss(0.66, 1, f) };
  }
  function formName(f) { return f < 0.12 ? "flat" : f < 0.4 ? "extruded" : f < 0.72 ? "inflated" : "melted"; }

  const PRESETS = {
    flat:     { form: 0, twist: 0, bend: 0, wave: 0, spin: 0, surface: "image" },
    extruded: { form: 33, twist: 0, bend: 0, wave: 0, spin: 15, surface: "image" },
    balloon:  { form: 62, twist: 0, bend: 0, wave: 10, spin: 20, surface: "image" },
    melt:     { form: 92, twist: 0, bend: 0, wave: 0, spin: 10, surface: "image" },
    ribbon:   { form: 30, twist: 70, bend: 40, wave: 30, spin: 0, depth: 15, surface: "image" },
    glass:    { form: 60, twist: 0, bend: 25, wave: 0, spin: 25, surface: "glass" },
  };
  function setChip(groupId, v) {
    state[groupId] = v;
    $(groupId).querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  }
  $("presets").addEventListener("click", (e) => {
    const p = PRESETS[e.target.dataset.p]; if (!p) return;
    for (const [k, v] of Object.entries(p)) {
      if (k === "surface") setChip("surface", v);
      else { $(k).value = v; }
    }
    readouts();
    if ("depth" in p) build();
  });
  ["layout", "surface"].forEach((id) => $(id).addEventListener("click", (e) => { if (e.target.dataset.v) setChip(id, e.target.dataset.v); }));

  function readouts() {
    document.querySelectorAll("label.row").forEach((l) => {
      const i = l.querySelector("input"), v = l.querySelector(".v");
      if (i && v) v.textContent = i.value;
    });
    $("formRead").textContent = formName(val("form") / 100);
  }
  let rebuildTimer;
  const rebuildSoon = () => { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(build, 160); };
  ["text", "face", "size", "track", "depth", "bevel"].forEach((id) => $(id).addEventListener("input", rebuildSoon));
  $("panel").addEventListener("input", readouts);

  // ---------- UI chrome ----------
  const togglePanel = () => $("panel").classList.toggle("hidden");
  $("toggle").onclick = togglePanel;
  window.addEventListener("keydown", (e) => { if ((e.key === "c" || e.key === "C") && e.target.tagName !== "INPUT") togglePanel(); });

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    const pr = renderer.getPixelRatio();
    shared.uRes.value.set(w * pr, h * pr);
  }
  window.addEventListener("resize", () => { resize(); rebuildSoon(); });
  resize();

  // ---------- loop ----------
  let travel = 0, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    shared.uTime.value = now / 1000;
    const f = val("form") / 100, st = formStages(f);
    const variety = val("variety") / 100, spin = val("spin") / 100;
    travel += dt * (val("travel") / 100) * VIEW_W() * 0.12;
    const span = VIEW_W() + wordW;
    const tx = ((((travel + span / 2) % span) + span) % span) - span / 2;
    const letterMode = state.layout === "letters";
    letters.forEach((l) => {
      const u = l.mesh.material.uniforms;
      const vary = (s) => (rand(l.k, s) - 0.5) * 2 * variety;
      const lf = Math.min(1, Math.max(0, f + vary(1) * 0.25));
      const ls = formStages(lf);
      u.uSize.value = letterSize;
      u.uFlat.value = ls.flat; u.uInflate.value = ls.inflate; u.uMelt.value = ls.melt;
      u.uSeed.value = l.k * 3.1;
      u.uOffX.value = l.offX;
      u.uOffY.value = letterMode ? Math.sin(now / 1400 + l.k * 1.7) * wordW * 0.04 * (0.3 + variety) : vary(2) * wordW * 0.015;
      u.uSpinA.value = letterMode ? (now / 1000) * spin * (0.6 + rand(l.k, 3)) * 1.6 + l.k : Math.sin(now / 2600 + l.k * 0.5) * spin * 0.9;
      u.uWordW.value = wordW;
      u.uTwist.value = val("twist") / 100;
      u.uBend.value = val("bend") / 100;
      u.uWave.value = val("wave") / 100;
      u.uTravelX.value = tx;
      u.uSurface.value = state.surface === "image" ? 0 : state.surface === "glass" ? 1 : 2;
      u.uMagnify.value = val("magnify") / 100;
    });
    // gentle tilt of the whole word when it's a single object
    word.rotation.y = letterMode ? 0 : Math.sin(now / 3200) * spin * 0.5;
    word.rotation.x = Math.sin(now / 4100) * 0.12 * spin;

    renderer.clear();
    renderer.render(bgScene, bgCam);
    renderer.clearDepth();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  readouts();
  build().then(() => requestAnimationFrame(frame));
})();
</script>
</body>
</html>
