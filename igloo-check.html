<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Igloo check — Photo Remix</title>
<!--
  Igloo diagnostic page for the photo-remix app. Standalone — not part of
  the app's index.html / app.js / style.css, and loads nothing from them.

  Open it on the suite's playback machine (same browser the app will run
  in), go fullscreen, and it will:
    - draw a calibration pattern across the whole window: 6 equal panels
      (the suite's 6 x 1920x1038 walls), true circles, 1px checker strips,
      edge labels — to see how the page actually maps onto the walls
    - report browser, display, GPU, canvas limits, audio, input devices
    - benchmark the app's effect techniques at this window's size and at
      the Igloo walls size (11520x1038)
    - run a moving bar across every seam to check smoothness/tearing
  Then "Copy report" (or Download) and bring the JSON back.

  Keys: H hide panel · F fullscreen · M moving bar · B benchmark
        ← → move the panel to another wall panel
-->
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000; color: #eee;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  #pattern { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #bar {
    position: fixed; top: 0; bottom: 0; left: 0; width: max(4px, 0.25vw);
    background: #fff; display: none; will-change: transform; z-index: 2;
  }
  #panel {
    position: fixed; top: 2vh; z-index: 5;
    max-height: 96vh; overflow-y: auto;
    padding: 1.2em 1.4em; border-radius: 10px;
    background: rgba(10, 10, 10, 0.92); border: 1px solid #333;
    font-size: clamp(12px, 1.45vh, 26px); line-height: 1.4;
  }
  #panel.hidden { display: none; }
  #panel h1 { font-size: 1.35em; margin: 0 0 0.2em; }
  #panel h2 {
    font-size: 1em; margin: 1.1em 0 0.3em; color: #0f0;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  #panel .sub { color: #999; margin: 0 0 0.8em; }
  #panel table { border-collapse: collapse; width: 100%; }
  #panel td { padding: 0.1em 0.6em 0.1em 0; vertical-align: top; word-break: break-word; }
  #panel td.k { color: #888; white-space: nowrap; width: 1%; }
  #panel .ok { color: #0f0; } #panel .warn { color: #ff0; } #panel .bad { color: #f55; }
  #panel .buttons { display: flex; flex-wrap: wrap; gap: 0.4em; margin: 0.6em 0; }
  #panel button, #panel a.btn {
    font: inherit; font-size: 0.95em; padding: 0.35em 0.7em; border-radius: 6px;
    border: 1px solid #555; background: #1c1c1c; color: #eee; cursor: pointer; text-decoration: none;
  }
  #panel button:hover, #panel a.btn:hover { background: #2a2a2a; }
  #panel .keys { color: #777; font-size: 0.9em; margin-top: 1em; }
  #status { color: #ff0; min-height: 1.4em; }
</style>
</head>
<body>
<canvas id="pattern"></canvas>
<div id="bar"></div>

<div id="panel">
  <h1>Igloo check</h1>
  <p class="sub">Photo Remix · diagnostic for the Immersive Suite</p>
  <div class="buttons">
    <button id="btnFullscreen">Fullscreen (F)</button>
    <button id="btnBar">Moving bar (M)</button>
    <button id="btnBench">Run benchmark (B)</button>
    <button id="btnTone">Test tone L→R</button>
    <button id="btnScreens">Detect screens</button>
    <button id="btnCopy">Copy report</button>
    <button id="btnDownload">Download .json</button>
  </div>
  <div class="buttons">
    <a class="btn" href="index.html?stage=desktop" target="_blank">Open app (desktop)</a>
    <a class="btn" href="index.html" target="_blank">Open app (phone)</a>
  </div>
  <div id="status"></div>
  <div id="report"></div>
  <div class="keys">H hide panel · F fullscreen · M moving bar · B benchmark · ← → move panel</div>
</div>

<script>
(() => {
  "use strict";

  // Suite canvas sizes from the Igloo resolution sheet.
  const IGLOO = {
    walls: { w: 11520, h: 1038, panels: 6 },
    floor: { w: 3674, h: 3674 },
    combined: { w: 11520, h: 4712 },
  };

  const $ = (id) => document.getElementById(id);
  const report = { generatedAt: new Date().toISOString(), page: location.href };

  // ---------------------------------------------------------------------
  // Report rendering
  // ---------------------------------------------------------------------
  const SECTION_ORDER = ["display", "browser", "gpu", "canvas", "audio", "performance", "benchmark", "screens", "input"];
  let renderQueued = false;

  function set(section, key, value) {
    (report[section] ||= {})[key] = value;
    queueRender();
  }

  function queueRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => {
      renderQueued = false;
      render();
    });
  }

  function esc(s) {
    return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  }

  function fmt(v) {
    if (v === undefined || v === null) return '<span class="warn">n/a</span>';
    if (typeof v === "boolean") return v ? '<span class="ok">yes</span>' : "no";
    if (typeof v === "object") {
      if (v.html) return v.html;
      return esc(Array.isArray(v) ? v.join(" · ") : JSON.stringify(v));
    }
    return esc(v);
  }

  function render() {
    const out = [];
    for (const section of SECTION_ORDER) {
      const data = report[section];
      if (!data) continue;
      out.push(`<h2>${section}</h2><table>`);
      for (const [k, v] of Object.entries(data)) {
        out.push(`<tr><td class="k">${esc(k)}</td><td>${fmt(v)}</td></tr>`);
      }
      out.push("</table>");
    }
    $("report").innerHTML = out.join("");
  }

  function status(text) {
    $("status").textContent = text;
  }

  // Tagged value: shows coloured in the panel, stays plain text in the JSON.
  function tag(text, cls) {
    const v = { text, html: `<span class="${cls}">${esc(text)}</span>` };
    v.toJSON = () => text;
    return v;
  }

  // ---------------------------------------------------------------------
  // Display
  // ---------------------------------------------------------------------
  function deviceSize() {
    const dpr = window.devicePixelRatio || 1;
    return { w: Math.round(innerWidth * dpr), h: Math.round(innerHeight * dpr), dpr };
  }

  function matchSuite(w, h) {
    const near = (a, b) => Math.abs(a - b) / b < 0.02;
    for (const [name, s] of Object.entries(IGLOO)) {
      if (near(w, s.w) && near(h, s.h)) return tag(`matches Igloo ${name} (${s.w}×${s.h})`, "ok");
    }
    const aspect = w / h;
    for (const [name, s] of Object.entries(IGLOO)) {
      if (Math.abs(aspect - s.w / s.h) / (s.w / s.h) < 0.03) {
        return tag(`same aspect as Igloo ${name}, but scaled ×${(w / s.w).toFixed(3)}`, "warn");
      }
    }
    return tag(`no match (aspect ${aspect.toFixed(3)}; walls ${(IGLOO.walls.w / IGLOO.walls.h).toFixed(3)})`, "warn");
  }

  function collectDisplay() {
    const d = deviceSize();
    set("display", "window (CSS px)", `${innerWidth}×${innerHeight}`);
    set("display", "window (device px)", `${d.w}×${d.h}`);
    set("display", "devicePixelRatio", d.dpr);
    set("display", "vs suite canvas", matchSuite(d.w, d.h));
    set("display", "one sixth (device px)", `${(d.w / 6).toFixed(1)} wide (Igloo wall panel = 1920)`);
    set("display", "outer window", `${outerWidth}×${outerHeight} at ${screenX},${screenY}`);
    set("display", "screen", `${screen.width}×${screen.height} (avail ${screen.availWidth}×${screen.availHeight})`);
    set("display", "screen.isExtended", "isExtended" in screen ? screen.isExtended : undefined);
    set("display", "colour depth", screen.colorDepth);
    set("display", "orientation", screen.orientation ? screen.orientation.type : undefined);
    set("display", "fullscreen", !!document.fullscreenElement);
    set("display", "HDR / wide gamut", [
      matchMedia("(dynamic-range: high)").matches ? "HDR" : "SDR",
      matchMedia("(color-gamut: p3)").matches ? "P3" : "sRGB",
    ]);
  }

  // ---------------------------------------------------------------------
  // Browser / machine
  // ---------------------------------------------------------------------
  async function collectBrowser() {
    set("browser", "userAgent", navigator.userAgent);
    const uad = navigator.userAgentData;
    if (uad) {
      set("browser", "brands", uad.brands.map((b) => `${b.brand} ${b.version}`));
      try {
        const hi = await uad.getHighEntropyValues(["platform", "platformVersion", "architecture", "model", "fullVersionList"]);
        set("browser", "platform", `${hi.platform} ${hi.platformVersion} ${hi.architecture || ""}`.trim());
        if (hi.fullVersionList) set("browser", "full versions", hi.fullVersionList.map((b) => `${b.brand} ${b.version}`));
      } catch (e) { /* not granted */ }
    } else {
      set("browser", "platform", navigator.platform);
    }
    set("browser", "CPU threads", navigator.hardwareConcurrency);
    set("browser", "device memory (GB, capped at 8)", navigator.deviceMemory);
    if (performance.memory) {
      set("browser", "JS heap limit", `${Math.round(performance.memory.jsHeapSizeLimit / 1048576)} MB`);
    }
    set("browser", "online", navigator.onLine);
    const c = navigator.connection;
    if (c) set("browser", "connection", `${c.effectiveType || "?"}, ~${c.downlink ?? "?"} Mbps, rtt ${c.rtt ?? "?"} ms`);
    set("browser", "secure context", window.isSecureContext);
    set("browser", "features", [
      ["OffscreenCanvas", "OffscreenCanvas" in window],
      ["createImageBitmap", "createImageBitmap" in window],
      ["BroadcastChannel", "BroadcastChannel" in window],
      ["Fullscreen API", !!document.documentElement.requestFullscreen],
      ["Window Management", "getScreenDetails" in window],
      ["WebGPU", "gpu" in navigator],
    ].map(([n, ok]) => `${n} ${ok ? "✓" : "✗"}`));
  }

  // ---------------------------------------------------------------------
  // GPU + canvas limits
  // ---------------------------------------------------------------------
  async function collectGpu() {
    const c = document.createElement("canvas");
    const gl = c.getContext("webgl2") || c.getContext("webgl");
    if (gl) {
      const ext = gl.getExtension("WEBGL_debug_renderer_info");
      set("gpu", "WebGL", gl instanceof WebGL2RenderingContext ? "WebGL 2" : "WebGL 1");
      set("gpu", "vendor", ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR));
      set("gpu", "renderer", ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
      set("gpu", "max texture size", gl.getParameter(gl.MAX_TEXTURE_SIZE));
      const vp = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
      set("gpu", "max viewport", `${vp[0]}×${vp[1]}`);
      const tex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
      set("gpu", "fits 11520 wide texture", tex >= 11520
        ? tag(`yes (${tex})`, "ok")
        : tag(`no — max ${tex}, a single 11520-wide GPU texture won't fit`, "warn"));
      const lose = gl.getExtension("WEBGL_lose_context");
      if (lose) lose.loseContext();
    } else {
      set("gpu", "WebGL", tag("unavailable — likely software rendering", "bad"));
    }
    if (navigator.gpu) {
      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (adapter) {
          const info = adapter.info || (adapter.requestAdapterInfo ? await adapter.requestAdapterInfo() : {});
          set("gpu", "WebGPU adapter", [info.vendor, info.architecture, info.device, info.description].filter(Boolean).join(" ") || "available");
        } else {
          set("gpu", "WebGPU adapter", "none");
        }
      } catch (e) {
        set("gpu", "WebGPU adapter", `error: ${e.message}`);
      }
    }
  }

  // Can a 2D canvas of this size be created, drawn to and read back?
  function tryCanvas(w, h) {
    const c = document.createElement("canvas");
    try {
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      if (!ctx || c.width !== w || c.height !== h) return false;
      ctx.fillStyle = "#ff0000";
      ctx.fillRect(w - 1, h - 1, 1, 1);
      const ok = ctx.getImageData(w - 1, h - 1, 1, 1).data[0] === 255;
      return ok;
    } catch (e) {
      return false;
    } finally {
      c.width = 0; c.height = 0;
    }
  }

  function collectCanvasLimits() {
    const sizes = [
      ["walls 11520×1038", 11520, 1038],
      ["floor 3674×3674", 3674, 3674],
      ["combined 11520×4712", 11520, 4712],
      ["walls @2x 23040×2076", 23040, 2076],
    ];
    for (const [label, w, h] of sizes) {
      set("canvas", label, tryCanvas(w, h) ? tag("ok", "ok") : tag("FAILED", "bad"));
    }
  }

  // ---------------------------------------------------------------------
  // Audio
  // ---------------------------------------------------------------------
  let audioCtx = null;
  function collectAudio() {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      set("audio", "context state at load", audioCtx.state === "running"
        ? tag("running — autoplay allowed", "ok")
        : tag(`${audioCtx.state} — needs a click/key before sound plays`, "warn"));
      set("audio", "sample rate", `${audioCtx.sampleRate} Hz`);
      set("audio", "output channels (max)", audioCtx.destination.maxChannelCount);
      if (audioCtx.baseLatency) set("audio", "base latency", `${(audioCtx.baseLatency * 1000).toFixed(1)} ms`);
    } catch (e) {
      set("audio", "Web Audio", tag(`unavailable: ${e.message}`, "bad"));
    }
    if (navigator.getAutoplayPolicy) {
      try { set("audio", "autoplay policy (media)", navigator.getAutoplayPolicy("mediaelement")); } catch (e) { /* */ }
    }
  }

  // 3s tone panned left → right, to check which speakers the stereo mix
  // lands on in the suite.
  async function playTone() {
    if (!audioCtx) return;
    await audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const pan = audioCtx.createStereoPanner();
    osc.frequency.value = 440;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.25, t + 0.1);
    gain.gain.setValueAtTime(0.25, t + 2.9);
    gain.gain.linearRampToValueAtTime(0, t + 3);
    pan.pan.setValueAtTime(-1, t);
    pan.pan.linearRampToValueAtTime(1, t + 3);
    osc.connect(gain).connect(pan).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 3.05);
    set("audio", "test tone", `played (context now ${audioCtx.state})`);
  }

  // ---------------------------------------------------------------------
  // Screens (Window Management API — Chrome/Edge, asks permission)
  // ---------------------------------------------------------------------
  async function detectScreens() {
    if (!("getScreenDetails" in window)) {
      set("screens", "Window Management API", "not supported in this browser");
      return;
    }
    try {
      const details = await window.getScreenDetails();
      set("screens", "count", details.screens.length);
      details.screens.forEach((s, i) => {
        set("screens", `#${i + 1}${s.isPrimary ? " (primary)" : ""}${s === details.currentScreen ? " (this window)" : ""}`,
          `${s.label || "unnamed"} · ${s.width}×${s.height} at ${s.left},${s.top} · dpr ${s.devicePixelRatio}`);
      });
    } catch (e) {
      set("screens", "error", e.message);
    }
  }

  // ---------------------------------------------------------------------
  // Input log — how will the facilitator drive it in the suite?
  // ---------------------------------------------------------------------
  const inputLog = [];
  const pointerTypes = new Set();
  function logInput(text) {
    inputLog.unshift(`${new Date().toLocaleTimeString()} ${text}`);
    inputLog.length = Math.min(inputLog.length, 8);
    set("input", "pointer types seen", pointerTypes.size ? [...pointerTypes] : "none yet");
    set("input", "recent", inputLog);
  }
  window.addEventListener("keydown", (e) => logInput(`key "${e.key}" (${e.code})`));
  window.addEventListener("pointerdown", (e) => {
    pointerTypes.add(e.pointerType);
    logInput(`${e.pointerType} down at ${Math.round(e.clientX)},${Math.round(e.clientY)}`);
  });
  window.addEventListener("wheel", (e) => logInput(`wheel ${Math.round(e.deltaY)}`), { passive: true });
  window.addEventListener("gamepadconnected", (e) => logInput(`gamepad: ${e.gamepad.id}`));

  // ---------------------------------------------------------------------
  // Calibration pattern
  // ---------------------------------------------------------------------
  function drawPattern() {
    const cv = $("pattern");
    const { w: W, h: H, dpr } = deviceSize();
    cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#0b0b0b";
    ctx.fillRect(0, 0, W, H);

    // Wall/floor split, only if this window has the combined canvas's aspect.
    const combinedAspect = IGLOO.combined.w / IGLOO.combined.h;
    const wallH = Math.abs(W / H - combinedAspect) / combinedAspect < 0.03
      ? Math.round((H * IGLOO.walls.h) / IGLOO.combined.h)
      : H;

    // Grid: faint every 100 device px, brighter every 500 with labels.
    const labelPx = Math.max(10, Math.round(H * 0.012));
    ctx.font = `${labelPx}px ui-monospace, Menlo, monospace`;
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 100) {
      ctx.strokeStyle = x % 500 === 0 ? "#333" : "#1a1a1a";
      ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); ctx.stroke();
      if (x % 500 === 0 && x > 0) { ctx.fillStyle = "#555"; ctx.fillText(String(x), x + 3, H - 4); }
    }
    for (let y = 0; y <= H; y += 100) {
      ctx.strokeStyle = y % 500 === 0 ? "#333" : "#1a1a1a";
      ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke();
      if (y % 500 === 0 && y > 0) { ctx.fillStyle = "#555"; ctx.fillText(String(y), 3, y - 3); }
    }

    // Six equal wall panels.
    const n = IGLOO.walls.panels;
    const pw = W / n;
    const hues = [0, 60, 120, 180, 240, 300];
    for (let i = 0; i < n; i++) {
      const x0 = Math.round(i * pw), x1 = Math.round((i + 1) * pw);
      ctx.fillStyle = `hsla(${hues[i]}, 80%, 50%, 0.10)`;
      ctx.fillRect(x0, 0, x1 - x0, wallH);

      // Colour bar strip across the top of each panel.
      const bars = ["#fff", "#ff0", "#0ff", "#0f0", "#f0f", "#f00", "#00f", "#000"];
      const bw = (x1 - x0) / bars.length, bh = Math.round(wallH * 0.05);
      bars.forEach((c, j) => { ctx.fillStyle = c; ctx.fillRect(x0 + j * bw, 0, Math.ceil(bw), bh); });

      // A true circle: if it looks like an oval on the wall, the page is
      // being stretched.
      const r = Math.min(x1 - x0, wallH) * 0.3;
      const cx = (x0 + x1) / 2, cy = wallH / 2;
      ctx.strokeStyle = `hsl(${hues[i]}, 90%, 60%)`;
      ctx.lineWidth = Math.max(2, Math.round(H * 0.004));
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke();

      // Big panel number + pixel range.
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `bold ${Math.round(r * 0.9)}px ui-monospace, Menlo, monospace`;
      ctx.fillText(String(i + 1), cx, cy);
      ctx.font = `${Math.round(labelPx * 1.4)}px ui-monospace, Menlo, monospace`;
      ctx.fillText(`x ${x0}–${x1 - 1} (${x1 - x0} px)`, cx, cy + r + labelPx * 2.2);

      // 1px black/white checker: reads as flat grey if pixels are 1:1,
      // shows moiré/blur if the output is being scaled.
      const sw = Math.round(Math.min(200, (x1 - x0) * 0.4)), sh = Math.round(Math.min(40, wallH * 0.05));
      const sx = Math.round(cx - sw / 2), sy = Math.round(wallH - sh - labelPx * 3);
      const img = ctx.createImageData(sw, sh);
      for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
        const v = (x + y) % 2 ? 255 : 0, k = (y * sw + x) * 4;
        img.data[k] = img.data[k + 1] = img.data[k + 2] = v; img.data[k + 3] = 255;
      }
      ctx.putImageData(img, sx, sy);
      ctx.font = `${labelPx}px ui-monospace, Menlo, monospace`;
      ctx.fillText("1px checker", cx, sy - labelPx);
      ctx.textAlign = "start";
      ctx.textBaseline = "alphabetic";

      // Seam line.
      if (i > 0) {
        ctx.strokeStyle = "#f0f";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x0 + 0.5, 0); ctx.lineTo(x0 + 0.5, wallH); ctx.stroke();
      }
    }

    if (wallH < H) {
      ctx.strokeStyle = "#ff0";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, wallH); ctx.lineTo(W, wallH); ctx.stroke();
      ctx.fillStyle = "#ff0";
      ctx.font = `${labelPx * 2}px ui-monospace, Menlo, monospace`;
      ctx.fillText("↑ walls · floor ↓ (combined canvas layout guess)", 20, wallH + labelPx * 3);
    }

    // Edge markers.
    ctx.fillStyle = "#f00";
    const e = Math.max(4, Math.round(H * 0.006));
    ctx.fillRect(0, 0, e, H); ctx.fillRect(W - e, 0, e, H);
    ctx.fillRect(0, 0, W, e); ctx.fillRect(0, H - e, W, e);
    ctx.font = `${labelPx * 1.5}px ui-monospace, Menlo, monospace`;
    ctx.fillText(`${W}×${H} device px · dpr ${dpr}`, e + 8, H * 0.08);
  }

  // Keep the panel inside one wall panel (of 6) so it doesn't straddle a
  // seam; on a normal-width screen it just sits top-left.
  let panelSlot = 0;
  function placePanel() {
    const panel = $("panel");
    const sixth = innerWidth / 6;
    const margin = Math.max(12, innerWidth * 0.004);
    if (sixth >= 480) {
      panel.style.left = `${panelSlot * sixth + margin}px`;
      panel.style.width = `${Math.min(sixth - 2 * margin, 1100)}px`;
    } else {
      panel.style.left = `${margin}px`;
      panel.style.width = `${Math.min(620, innerWidth - 2 * margin)}px`;
    }
  }

  // ---------------------------------------------------------------------
  // FPS meter + moving bar (seam / tearing / smoothness check)
  // ---------------------------------------------------------------------
  let barOn = false;
  let frames = 0, windowStart = performance.now(), last = performance.now();
  let longFrames = 0, worstMs = 0;
  const fpsHistory = [];
  const BAR_SWEEP_S = 8;

  function tick(now) {
    const dt = now - last;
    last = now;
    frames++;
    if (dt > 50) longFrames++;
    worstMs = Math.max(worstMs, dt);

    if (barOn) {
      const x = (((now / 1000) % BAR_SWEEP_S) / BAR_SWEEP_S) * innerWidth;
      $("bar").style.transform = `translateX(${x}px)`;
    }

    if (now - windowStart >= 1000) {
      const fps = (frames * 1000) / (now - windowStart);
      fpsHistory.push(fps);
      if (fpsHistory.length > 10) fpsHistory.shift();
      set("performance", "frame rate (last 1s)", `${fps.toFixed(1)} fps`);
      set("performance", "worst of last 10s", `${Math.min(...fpsHistory).toFixed(1)} fps`);
      set("performance", "frames > 50ms (total)", longFrames);
      set("performance", "longest frame", `${worstMs.toFixed(0)} ms`);
      set("performance", "moving bar", barOn ? "running" : "off (M)");
      frames = 0;
      windowStart = now;
    }
    requestAnimationFrame(tick);
  }

  function toggleBar() {
    barOn = !barOn;
    $("bar").style.display = barOn ? "block" : "none";
    longFrames = 0; worstMs = 0; fpsHistory.length = 0;
  }

  // ---------------------------------------------------------------------
  // Benchmark — the app's effect techniques at real stage sizes
  // ---------------------------------------------------------------------
  // Mirrors app.js: slider-unit cell sizes scaled by height/1920, floored
  // by the same per-effect cell budgets (CONFIG.MAX_CELLS).
  const MAX_CELLS = { pixelate: 520000, halftone: 60000, ascii: 60000 };
  const cellPx = (slider, h, w, budget) => Math.max(1, (slider * h) / 1920, Math.sqrt((w * h) / budget));
  const nextFrame = () => new Promise((r) => setTimeout(r, 30));

  function makeSource(w, h) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, "#123"); g.addColorStop(0.5, "#c84"); g.addColorStop(1, "#4ae");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 400; i++) {
      ctx.fillStyle = `hsl(${Math.random() * 360}, 70%, ${20 + Math.random() * 60}%)`;
      ctx.fillRect(Math.random() * w, Math.random() * h, Math.random() * w * 0.1, Math.random() * h * 0.2);
    }
    return c;
  }

  // Average ms per call. getImageData(1px) forces the GPU queue to flush,
  // so the timing includes the actual drawing, not just queuing it.
  function time(ctx, n, fn) {
    fn();
    ctx.getImageData(0, 0, 1, 1);
    const t0 = performance.now();
    for (let i = 0; i < n; i++) fn();
    ctx.getImageData(0, 0, 1, 1);
    return (performance.now() - t0) / n;
  }

  // Thresholds: once-per-cycle work has the crossfade to hide behind;
  // animated redraws (pixelate/halftone/ascii tickers) fire every 180ms,
  // so they need to finish well inside that.
  function verdict(ms, animated) {
    const [ok, warn] = animated ? [60, 150] : [150, 400];
    const text = `${ms.toFixed(1)} ms`;
    return ms <= ok ? tag(text, "ok") : ms <= warn ? tag(`${text} (slow)`, "warn") : tag(`${text} (too slow)`, "bad");
  }

  async function benchSize(label, w, h) {
    const key = `${label} ${w}×${h}`;
    set("benchmark", key, "running…");
    await nextFrame();

    const src = makeSource(w, h);
    const dst = document.createElement("canvas");
    dst.width = w; dst.height = h;
    const d = dst.getContext("2d");
    const small = document.createElement("canvas");
    const s = small.getContext("2d");
    const res = {};

    // Plain full-frame copy — floor for every effect + Move pan per frame.
    res.copy = time(d, 10, () => d.drawImage(src, 0, 0));
    await nextFrame();

    // Pixelate: downscale → recolour small → hard-edged upscale.
    {
      const px = cellPx(12, h, w, MAX_CELLS.pixelate);
      const cols = Math.max(1, Math.round(w / px)), rows = Math.max(1, Math.round(h / px));
      small.width = cols; small.height = rows;
      res.pixelate = time(d, 5, () => {
        s.drawImage(src, 0, 0, cols, rows);
        const id = s.getImageData(0, 0, cols, rows);
        s.putImageData(id, 0, 0);
        d.imageSmoothingEnabled = false;
        d.drawImage(small, 0, 0, cols, rows, 0, 0, w, h);
        d.imageSmoothingEnabled = true;
      });
    }
    await nextFrame();

    // Duotone: full-frame getImageData → per-pixel luminance → putImageData.
    res.duotone = time(d, 2, () => {
      d.drawImage(src, 0, 0);
      const id = d.getImageData(0, 0, w, h);
      const px = id.data;
      for (let i = 0; i < px.length; i += 4) {
        const l = (0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]) / 255;
        px[i] = l * 255; px[i + 1] = l * 200; px[i + 2] = 60;
      }
      d.putImageData(id, 0, 0);
    });
    await nextFrame();

    // Halftone: one arc() per cell.
    {
      const px = cellPx(8, h, w, MAX_CELLS.halftone);
      const cols = Math.max(1, Math.round(w / px)), rows = Math.max(1, Math.round(h / px));
      const cw = w / cols, ch = h / rows, rMax = Math.min(cw, ch) * 0.46;
      small.width = cols; small.height = rows;
      s.drawImage(src, 0, 0, cols, rows);
      const sample = s.getImageData(0, 0, cols, rows).data;
      res.halftone = time(d, 2, () => {
        d.fillStyle = "#002fa7"; d.fillRect(0, 0, w, h);
        d.fillStyle = "#00ff00";
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          const i = (r * cols + c) * 4;
          const rad = rMax * ((0.299 * sample[i] + 0.587 * sample[i + 1] + 0.114 * sample[i + 2]) / 255);
          if (rad < 0.5) continue;
          d.beginPath(); d.arc(c * cw + cw / 2, r * ch + ch / 2, rad, 0, Math.PI * 2); d.fill();
        }
      });
      res.halftoneCells = cols * rows;
    }
    await nextFrame();

    // ASCII: one fillText() per cell.
    {
      const px = cellPx(18, h, w, MAX_CELLS.ascii);
      const cols = Math.max(1, Math.floor(w / px)), rows = Math.max(1, Math.floor(h / px));
      const cw = w / cols, ch = h / rows;
      const ramp = " .:-=+*#%@";
      small.width = cols; small.height = rows;
      s.drawImage(src, 0, 0, cols, rows);
      const sample = s.getImageData(0, 0, cols, rows).data;
      res.ascii = time(d, 2, () => {
        d.fillStyle = "#000"; d.fillRect(0, 0, w, h);
        d.font = `${Math.ceil(ch)}px monospace`;
        d.textBaseline = "top";
        d.fillStyle = "#0f0";
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          const i = (r * cols + c) * 4;
          const l = (0.299 * sample[i] + 0.587 * sample[i + 1] + 0.114 * sample[i + 2]) / 255;
          const chr = ramp[Math.min(ramp.length - 1, Math.floor(l * ramp.length))];
          if (chr !== " ") d.fillText(chr, c * cw, r * ch);
        }
      });
      res.asciiCells = cols * rows;
    }

    src.width = dst.width = small.width = 0;

    set("benchmark", key, {
      html: [
        `copy ${fmt(verdict(res.copy, true))}`,
        `pixelate ${fmt(verdict(res.pixelate, true))}`,
        `duotone ${fmt(verdict(res.duotone, false))}`,
        `halftone ${fmt(verdict(res.halftone, true))} <span style="color:#777">(${res.halftoneCells} cells)</span>`,
        `ascii ${fmt(verdict(res.ascii, true))} <span style="color:#777">(${res.asciiCells} cells)</span>`,
      ].join("<br>"),
      toJSON: () => Object.fromEntries(Object.entries(res).map(([k, v]) => [k, Math.round(v * 10) / 10])),
    });
  }

  let benchRunning = false;
  async function runBenchmark() {
    if (benchRunning) return;
    benchRunning = true;
    status("Benchmarking — the page may stutter for a few seconds…");
    const d = deviceSize();
    const sizes = [
      ["this window", d.w, d.h],
      ["Igloo walls", IGLOO.walls.w, IGLOO.walls.h],
      ["desktop cap", 2560, 1440],
      ["phone", 1080, 1920],
    ];
    const seen = new Set();
    try {
      for (const [label, w, h] of sizes) {
        if (seen.has(`${w}x${h}`)) continue;
        seen.add(`${w}x${h}`);
        await benchSize(label, w, h);
      }
      set("benchmark", "key", "ms per render · animated effects redraw every 180ms, so aim ≤ 60ms · duotone runs once per cycle");
      status("Benchmark done.");
    } catch (e) {
      status(`Benchmark error: ${e.message}`);
    }
    benchRunning = false;
    // The benchmark itself stalls the page — don't let that count against
    // the frame-rate readings.
    longFrames = 0; worstMs = 0; fpsHistory.length = 0;
  }

  // ---------------------------------------------------------------------
  // Export
  // ---------------------------------------------------------------------
  function reportJson() {
    report.generatedAt = new Date().toISOString();
    return JSON.stringify(report, null, 2);
  }

  async function copyReport() {
    try {
      await navigator.clipboard.writeText(reportJson());
      status("Report copied to clipboard.");
    } catch (e) {
      status("Clipboard blocked — use Download instead.");
    }
  }

  function downloadReport() {
    const blob = new Blob([reportJson()], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `igloo-check-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    status("Report downloaded.");
  }

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.().catch((e) => status(`Fullscreen refused: ${e.message}`));
  }

  // ---------------------------------------------------------------------
  // Wiring
  // ---------------------------------------------------------------------
  $("btnFullscreen").onclick = toggleFullscreen;
  $("btnBar").onclick = toggleBar;
  $("btnBench").onclick = runBenchmark;
  $("btnTone").onclick = playTone;
  $("btnScreens").onclick = detectScreens;
  $("btnCopy").onclick = copyReport;
  $("btnDownload").onclick = downloadReport;

  window.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("button, a")) {
      if (e.key === " " || e.key === "Enter") return;
    }
    const k = e.key.toLowerCase();
    if (k === "h") $("panel").classList.toggle("hidden");
    else if (k === "f") toggleFullscreen();
    else if (k === "m") toggleBar();
    else if (k === "b") runBenchmark();
    else if (e.key === "ArrowRight") { panelSlot = (panelSlot + 1) % 6; placePanel(); }
    else if (e.key === "ArrowLeft") { panelSlot = (panelSlot + 5) % 6; placePanel(); }
  });

  let resizeTimer = null;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      drawPattern();
      placePanel();
      collectDisplay();
    }, 150);
  }
  window.addEventListener("resize", onResize);
  document.addEventListener("fullscreenchange", onResize);

  drawPattern();
  placePanel();
  collectDisplay();
  collectBrowser();
  collectGpu();
  collectCanvasLimits();
  collectAudio();
  set("input", "pointer types seen", "none yet — tap / click / press a key");
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
