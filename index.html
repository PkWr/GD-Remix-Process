<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spot</title>
<!-- Load style.css / app.js with a timestamp so browsers (phones especially)
     never run a cached old copy — GitHub Pages lets them cache for 10 min. -->
<script>document.write('<link rel="stylesheet" href="style.css?t=' + Date.now() + '">');</script>
<noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>
  <!-- Start screen: a plain visit (no ?stage / ?scene / ?reel … in the
       address) opens on a single "open" circle. Links to a particular look,
       the showreel or the Igloo skip it and go straight in. -->
  <script>if (!location.search) document.documentElement.classList.add("show-start");</script>
  <div id="startScreen">
    <button type="button" id="startOpen" aria-label="Open Spot">open</button>
    <div class="start-bottom" id="startBottom">
      <!-- About: the whole yellow bar grows upwards to show the About page's
           text (read from about.html, so there's one copy to edit). Opens on
           rollover / focus / tap of "About"; closes on leaving the bar or ×. -->
      <section class="start-about" id="startAbout" aria-label="About Spot">
        <button type="button" class="sa-close" id="startAboutClose" aria-label="Close About">×</button>
        <div class="sa-content" id="startAboutContent"><p><a href="about.html">About Spot</a></p></div>
      </section>
      <footer class="start-foot">
        <span><strong class="start-name">Spot</strong> © 2026 pkwr</span>
        <a href="about.html" id="startAboutLink" aria-controls="startAbout" aria-expanded="false">About</a>
      </footer>
    </div>
  </div>

  <main id="stage">
    <canvas id="canvasA" width="1080" height="1920"></canvas>
    <canvas id="canvasB" width="1080" height="1920"></canvas>
  </main>

  <audio id="bgAudio" loop autoplay preload="auto">
    <source src="assets/audio/track.mp3" type="audio/mpeg">
  </audio>

  <div id="diagnostics" class="hidden">
    <button type="button" id="diagClose" class="diag-close" title="Hide (D)" aria-label="Hide info panel">×</button>
    <div><span class="k">version</span> <span id="diagVersion">—</span></div>
    <div><span class="k">stage</span> <span id="diagStage">—</span></div>
    <div><span class="k">source</span> <span id="diagSource">—</span></div>
    <div><span class="k">image</span> <span id="diagImage">—</span></div>
    <div><span class="k">effect</span> <span id="diagEffect">—</span></div>
    <div><span class="k">hold</span> <span id="diagHold">—</span></div>
    <div><span class="k">move</span> <span id="diagMove">—</span></div>
    <div><span class="k">look</span> <span id="diagLook">—</span></div>
    <div id="diagPaused" class="paused-line hidden">PAUSED (press P to resume)</div>
    <div id="diagWarning" class="warn-line hidden"></div>
    <div class="hint">press D to hide, S for branding, L for live photos, R to record, P to pause, F for fullscreen, V for camera</div>
  </div>

  <div id="brandLockup" class="hidden" aria-hidden="true">
    <img src="assets/branding/lockup.svg" alt="Sheffield Hallam University — BA (Hons) Graphic Design">
  </div>

  <!-- Controls panel: built at load from settings.js — the one list of
       every setting (see buildPanel() there). -->
  <div id="controls" class="hidden"></div>

  <script>
    (function () {
      if (!document.documentElement.classList.contains("show-start")) return;
      var root = document.documentElement;
      var audio = document.getElementById("bgAudio");
      if (audio) { audio.autoplay = false; audio.pause(); } // silent until opened
      var btn = document.getElementById("startOpen");
      function open() {
        if (!root.classList.contains("show-start")) return;
        if (audio) audio.play().catch(function () {});
        root.classList.add("start-leaving");
        setTimeout(function () { root.classList.remove("show-start", "start-leaving"); }, 500);
      }
      btn.addEventListener("click", open);
      // About drawer: opens on rollover, keyboard focus or a tap on "About".
      var bottom = document.getElementById("startBottom");
      var aboutLink = document.getElementById("startAboutLink");
      function setAbout(on) {
        bottom.classList.toggle("about-open", on);
        aboutLink.setAttribute("aria-expanded", String(on));
      }
      // Phones fire a pretend rollover (and focus) just before a tap — ignore
      // those, so the tap itself decides: first tap opens, second follows.
      var lastTouch = 0;
      window.addEventListener("pointerdown", function (e) { if (e.pointerType !== "mouse") lastTouch = Date.now(); }, true);
      var touchy = function () { return Date.now() - lastTouch < 800; };
      aboutLink.addEventListener("mouseenter", function () { if (!touchy()) setAbout(true); });
      aboutLink.addEventListener("focus", function () { if (!touchy()) setAbout(true); });
      // (Touch screens send a pretend mouse-leave when the drawer grows away
      // from the finger — only a real mouse leaving closes it.)
      bottom.addEventListener("mouseleave", function () { if (!touchy()) setAbout(false); });
      bottom.addEventListener("focusout", function (e) { if (!bottom.contains(e.relatedTarget)) setAbout(false); });
      // Clicking / tapping "About" always opens it; close with ×, Escape,
      // or by moving off the bar (mouse).
      aboutLink.addEventListener("click", function (e) {
        e.preventDefault();
        setAbout(true);
      });
      document.getElementById("startAboutClose").addEventListener("click", function (e) { e.stopPropagation(); setAbout(false); });
      window.addEventListener("keydown", function (e) { if (e.key === "Escape") setAbout(false); });
      // Fill the drawer from about.html (the one copy of the About text).
      fetch("about.html").then(function (r) { return r.text(); }).then(function (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        var main = doc.querySelector("main");
        if (!main) return;
        main.querySelectorAll("footer, .eyebrow").forEach(function (n) { n.remove(); });
        main.querySelectorAll('a[href="index.html"]').forEach(function (n) { n.remove(); });
        document.getElementById("startAboutContent").innerHTML = main.innerHTML;
      }).catch(function () { /* keeps the plain link to about.html */ });
      document.getElementById("startScreen").addEventListener("pointerdown", function (e) {
        if (!bottom.contains(e.target)) setAbout(false);
      });
      // Enter or Space opens it too, without having to tab to the button first.
      window.addEventListener("keydown", function (e) {
        if ((e.key === "Enter" || e.key === " ") && root.classList.contains("show-start") && e.target === document.body) {
          e.preventDefault();
          open();
        }
      });
    })();
  </script>
  <script>document.write('<script src="settings.js?t=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<script src="app.js?t=' + Date.now() + '"><\/script>');</script>
</body>
</html>
