<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spot — Remote</title>
<!-- Timestamped so a cached old copy is never used (see index.html). -->
<script>document.write('<link rel="stylesheet" href="style.css?t=' + Date.now() + '">');</script>
<noscript><link rel="stylesheet" href="style.css"></noscript>
<style>
  /* Remote page only: the panel is the whole page here, not a floating
     box over the display, so undo style.css's fixed positioning and the
     phone bottom-sheet layout. Everything else is the same panel. */
  html, body {
    overflow: auto;
    background: #0b0b0c;
  }
  #controls {
    position: static !important;
    width: 100% !important;
    max-width: 520px !important;
    height: auto !important;
    min-height: 100vh;
    margin: 0 auto;
    border-width: 0 1px !important;
    border-radius: 0 !important;
    box-shadow: none !important;
  }
  #controls .cp-tabs {
    order: 0 !important;
    position: sticky;
    top: 0;
    z-index: 2;
    background: #121315;
    border-top: 0 !important;
    border-bottom: 1px solid #2a2d31 !important;
    padding-bottom: 0 !important;
  }
  #controls .cp-tabs button[aria-current="page"] { box-shadow: inset 0 -2px 0 #7cff8a !important; }
  #controls .cp-body { overflow: visible; }
  #remoteStatus {
    max-width: 520px;
    margin: 0 auto;
    padding: 10px 16px;
    font: 13px/1.4 system-ui, -apple-system, sans-serif;
    color: #ececec;
    background: #1c1d20;
  }
  #remoteStatus.connected {
    background: #17301c;
    color: #9fffa9;
  }
  /* Live / Detailed switch and the Live view's pads */
  #viewBar { display: flex; max-width: 520px; margin: 0 auto; background: #121315; border-bottom: 1px solid #2a2d31; }
  #viewBar button { flex: 1; padding: 11px 0; font: 600 14px system-ui, -apple-system, sans-serif; color: #a3a3a3; background: none; border: 0; cursor: pointer; }
  #viewBar button[aria-pressed="true"] { color: #ececec; box-shadow: inset 0 -2px 0 #7cff8a; }
  #live { max-width: 520px; margin: 0 auto; padding: 12px 12px 28px; background: #121315; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif; color: #ececec; }
  .lv-funcs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .lv-func { flex: none; position: relative; padding: 10px 14px; font: 600 14px system-ui, sans-serif; color: #ececec; background: #17191c; border: 1px solid #2a2d31; border-radius: 10px; cursor: pointer; }
  .lv-func[aria-pressed="true"] { border-color: #7cff8a; box-shadow: inset 0 0 0 1px #7cff8a; }
  .lv-func i { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: transparent; }
  .lv-func.is-on i { background: #7cff8a; }
  .lv-on { display: flex; justify-content: space-between; width: 100%; margin-top: 10px; padding: 14px 16px; font: 700 16px system-ui, sans-serif; color: #ececec; background: #17191c; border: 1px solid #2a2d31; border-radius: 12px; cursor: pointer; }
  .lv-on.is-on { color: #0b0b0c; background: #7cff8a; border-color: #7cff8a; }
  .lv-pads { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .lv-pads.one { grid-template-columns: 1fr; }
  .lv-pad { position: relative; aspect-ratio: 1; max-height: 56vh; border: 1px solid #3a3d42; border-radius: 14px; background: #0e0f11; touch-action: none; cursor: crosshair; --px: 0%; --py: 50%; }
  .lv-pad:focus-visible { outline: 2px solid #7cff8a; outline-offset: 2px; }
  .lv-dot { position: absolute; left: var(--px); top: var(--py); width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: #7cff8a; box-shadow: 0 0 0 5px rgba(124, 255, 138, 0.2); pointer-events: none; }
  .lv-zero { position: absolute; pointer-events: none; background: #3a3d42; }
  .lv-zx { top: 0; bottom: 0; width: 1px; }
  .lv-zy { left: 0; right: 0; height: 1px; }
  .lv-tag { position: absolute; font-size: 11px; color: #a3a3a3; pointer-events: none; max-width: 70%; }
  .lv-tx { right: 8px; bottom: 6px; }
  .lv-ty { left: 8px; top: 6px; }
  .lv-tv { left: 8px; bottom: 6px; font: 11px/1.2 "SF Mono", Menlo, monospace; color: #ececec; }
  .lv-row { display: flex; gap: 10px; margin-top: 14px; }
  .lv-btn { flex: 1; padding: 13px 0; font: 600 15px system-ui, sans-serif; color: #ececec; background: #17191c; border: 1px solid #2a2d31; border-radius: 12px; cursor: pointer; }
  .lv-scenes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 14px; }
  .lv-scene { padding: 13px 0; font: 700 15px system-ui, sans-serif; color: #ececec; background: #17191c; border: 1px solid #2a2d31; border-radius: 10px; cursor: pointer; }
  .lv-scene.is-on { color: #0b0b0c; background: #7cff8a; border-color: #7cff8a; }
  #remoteStatus { position: sticky; top: 0; z-index: 10; }
  #remoteStatus.bad { background: #4a1717; color: #ffb4b4; font-weight: 600; }
  body.is-offline #live, body.is-offline #controls, body.is-offline #viewBar { opacity: 0.35; pointer-events: none; }
  .lv-h { margin: 16px 0 6px; font-size: 12px; color: #a3a3a3; text-transform: uppercase; letter-spacing: 0.06em; }
  .lv-pal-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .lv-pal-n { flex: none; width: 44px; height: 44px; font: 700 16px system-ui, sans-serif; color: #a3a3a3; background: #17191c; border: 1px solid #2a2d31; border-radius: 10px; cursor: pointer; }
  .lv-pal-n.is-on { color: #0b0b0c; background: #7cff8a; border-color: #7cff8a; }
  .lv-sw { flex: 1; display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; font-size: 12px; color: #a3a3a3; background: #17191c; border: 1px solid #2a2d31; border-radius: 10px; }
  .lv-sw input { width: 44px; height: 36px; padding: 0; border: 0; border-radius: 6px; background: none; cursor: pointer; }
  .lv-wide { width: 100%; margin-top: 4px; }
  .lv-btn.is-on { color: #0b0b0c; background: #7cff8a; border-color: #7cff8a; }
  .lv-key { margin-left: 6px; text-transform: none; letter-spacing: 0; color: #6f7378; }
  .lv-pals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .lv-pal-cell { display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: #17191c; border: 1px solid #2a2d31; border-radius: 12px; }
  .lv-dotc { flex: none; display: block; width: 44px; height: 44px; }
  .lv-dotc input { -webkit-appearance: none; appearance: none; width: 44px; height: 44px; padding: 0; margin: 0; border: 2px solid #3a3d42; border-radius: 50%; background: none; overflow: hidden; cursor: pointer; }
  .lv-dotc input::-webkit-color-swatch-wrapper { padding: 0; }
  .lv-dotc input::-webkit-color-swatch { border: 0; border-radius: 50%; }
  .lv-dotc input::-moz-color-swatch { border: 0; border-radius: 50%; }
  .lv-screen { grid-column: 1 / -1; }
  .lv-cap { font-size: 13px; color: #a3a3a3; }
  .lv-hue { background-image: linear-gradient(to bottom, #fff 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0) 50%, #000 100%), linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); background-color: #000; --dc: #fff; }
  .lv-hue .lv-dot { background: var(--dc); box-shadow: 0 0 0 3px #fff, 0 0 0 5px rgba(0, 0, 0, 0.5); }
  .lv-hue .lv-tag { color: #fff; text-shadow: 0 1px 2px #000; }
  .lv-hue .lv-tv { color: #fff; }
  .lv-pal-n.is-sel { box-shadow: inset 0 0 0 2px #ececec; }
</style>
</head>
<body>
  <p id="remoteStatus">Looking for the display page…</p>

  <div id="viewBar"><button type="button" data-view="live" aria-pressed="true">Live</button><button type="button" data-view="detail" aria-pressed="false">Detailed</button></div>
  <div id="live"></div>

  <!-- Built from settings.js — the same list as the display page, so the
       two can never drift apart. Display-only extras (presets, profile,
       output buttons) are left out here. -->
  <div id="controls"></div>

  <script>document.write('<script src="settings.js?t=' + Date.now() + '"><\/script>');</script>
  <script>window.PhotoRemixSettings.buildPanel(document.getElementById("controls"), { mode: "remote" });</script>
  <script>document.write('<script src="relay.js?t=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<script src="controls.js?t=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<script src="live.js?t=' + Date.now() + '"><\/script>');</script>
</body>
</html>
